spring.application.name=usuario

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:usuario_db}
spring.datasource.username=${DB_USER:user_adm}
spring.datasource.password=${DB_PASSWORD:Nykolas2111}
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=8081

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=always

# Debe coincidir con la clave configurada en el API Gateway
security.jwt.secret=jwt_secret_sanos_salvos_2026_clave_muy_segura_12345
security.jwt.expiration-ms=86400000

mascotas.service.url=http://mascotas:8082

# Instancia "mascotasService": protege la llamada (RestTemplate) al servicio de mascotas.
# El circuito se ABRE tras 5 errores de CONEXIÓN consecutivos.
resilience4j.circuitbreaker.instances.mascotasService.sliding-window-type=count_based
resilience4j.circuitbreaker.instances.mascotasService.sliding-window-size=5
resilience4j.circuitbreaker.instances.mascotasService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.mascotasService.failure-rate-threshold=100
resilience4j.circuitbreaker.instances.mascotasService.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.mascotasService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.mascotasService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.mascotasService.register-health-indicator=true
# RestTemplate envuelve los fallos de conexión en ResourceAccessException:
resilience4j.circuitbreaker.instances.mascotasService.record-exceptions=\
  org.springframework.web.client.ResourceAccessException,\
  java.net.ConnectException,\
  java.io.IOException
# Un error de estado HTTP (4xx/5xx) NO debe abrir el circuito:
resilience4j.circuitbreaker.instances.mascotasService.ignore-exceptions=\
  org.springframework.web.client.RestClientResponseException

# Exponer estado de los circuit breakers (requiere actuator)
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
