# Motor de coincidencias FastAPI
fastapi.url=http://localhost:8000
matcher.score.alerta=0.90
# ───────────────────────── Resilience4j Circuit Breaker ─────────────────────────
# Instancia "fastapiMatcher": protege la llamada al motor de coincidencias FastAPI.
# El circuito se ABRE tras 5 errores de CONEXIÓN consecutivos.
resilience4j.circuitbreaker.instances.fastapiMatcher.sliding-window-type=count_based
resilience4j.circuitbreaker.instances.fastapiMatcher.sliding-window-size=5
resilience4j.circuitbreaker.instances.fastapiMatcher.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.fastapiMatcher.failure-rate-threshold=100
resilience4j.circuitbreaker.instances.fastapiMatcher.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.fastapiMatcher.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.fastapiMatcher.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.fastapiMatcher.register-health-indicator=true
# Solo los errores de conexión cuentan como fallo (un 4xx/5xx NO abre el circuito):
resilience4j.circuitbreaker.instances.fastapiMatcher.record-exceptions=\
  org.springframework.web.reactive.function.client.WebClientRequestException,\
  java.util.concurrent.TimeoutException,\
  java.net.ConnectException,\
  io.netty.channel.ConnectTimeoutException,\
  java.io.IOException
resilience4j.circuitbreaker.instances.fastapiMatcher.ignore-exceptions=\
  org.springframework.web.reactive.function.client.WebClientResponseException

# Exponer estado de los circuit breakers (requiere actuator)
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

