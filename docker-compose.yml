services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER:-user_adm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Nykolas2111}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_adm -d usuario_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: sanos-salvos-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: sanos-salvos-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sanos-salvos-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: sanos-salvos
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  usuario:
    image: ${DOCKER_HUB_USER:-nyko115}/sanos-y-salvos-backend:usuario-${IMAGE_TAG:-latest}
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: usuario_db
      DB_USER: ${DB_USER:-user_adm}
      DB_PASSWORD: ${DB_PASSWORD:-Nykolas2111}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  fastapi-matcher:
    image: fastapi-matcher:local
    container_name: sanos-salvos-fastapi-matcher
    environment:
      SPRING_URL: http://apigateway:8080
    ports:
      - "8000:8000"

  mascotas:
    image: ${DOCKER_HUB_USER:-nyko115}/sanos-y-salvos-backend:mascotas-${IMAGE_TAG:-latest}
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: mascotas_db
      DB_USER: ${DB_USER:-user_adm}
      DB_PASSWORD: ${DB_PASSWORD:-Nykolas2111}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FASTAPI_URL: http://fastapi-matcher:8000
      REPORTES_SERVICE_URL: http://reportes:8083

    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      fastapi-matcher:
        condition: service_started

  reportes:
    image: ${DOCKER_HUB_USER:-nyko115}/sanos-y-salvos-backend:reportes-${IMAGE_TAG:-latest}
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: reportes_db
      DB_USER: ${DB_USER:-user_adm}
      DB_PASSWORD: ${DB_PASSWORD:-Nykolas2111}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  apigateway:
    image: ${DOCKER_HUB_USER:-nyko115}/sanos-y-salvos-backend:apigateway-${IMAGE_TAG:-latest}
    environment:
      SECURITY_JWT_SECRET: jwt_secret_sanos_salvos_2026_clave_muy_segura_12345
      MATCHER_SERVICE_URL: http://fastapi-matcher:8000
    ports:
      - "8080:8080"
    depends_on:
      - usuario
      - mascotas
      - reportes
      - fastapi-matcher

  db-sonarqube:
    image: postgres:16-alpine
    container_name: db-sonarqube
    environment:
      POSTGRES_USER: sonar           
      POSTGRES_PASSWORD: sonar_1234  
      POSTGRES_DB: sonar
    volumes:
      - sonar-db-data:/var/lib/postgresql/data

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    depends_on:
      - db-sonarqube
    environment:
      SONAR_JDBC_USERNAME: sonar          
      SONAR_JDBC_PASSWORD: sonar_1234     
      SONAR_JDBC_URL: jdbc:postgresql://db-sonarqube:5432/sonar
    ports:
      - "9000:9000"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs

volumes:
  postgres-data:
  zookeeper-data:
  zookeeper-log:
  sonar-db-data:
  sonar-data:
  sonar-extensions:
  sonar-logs:
