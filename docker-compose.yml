services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user_adm
      POSTGRES_PASSWORD: Nykolas2111
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_adm -d usuario_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: sanos-salvos-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: sanos-salvos-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sanos-salvos-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: sanos-salvos
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  usuario:
    build:
      context: .
      dockerfile: usuario/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: usuario_db
      DB_USER: user_adm
      DB_PASSWORD: Nykolas2111
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  mascotas:
    build: ./mascotas
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: mascotas_db
      DB_USER: user_adm
      DB_PASSWORD: Nykolas2111
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FASTAPI_URL: http://host.docker.internal:8000
      REPORTES_SERVICE_URL: http://reportes:8083
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  reportes:
    build: ./reportes
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: reportes_db
      DB_USER: user_adm
      DB_PASSWORD: Nykolas2111
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  apigateway:
    build: ./apigateway
    environment:
      USUARIO_SERVICE_URL: http://usuario:8081
      MASCOTAS_SERVICE_URL: http://mascotas:8082
      REPORTES_SERVICE_URL: http://reportes:8083
    ports:
      - "8080:8080"
    depends_on:
      - usuario
      - mascotas
      - reportes

volumes:
  postgres-data:
  zookeeper-data:
  zookeeper-log: