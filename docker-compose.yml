services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user_adm
      POSTGRES_PASSWORD: Nykolas2111
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"

  usuario:
    build:
      context: .
      dockerfile: usuario/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: usuario_db
      DB_USER: user_adm
      DB_PASSWORD: Nykolas2111
    ports:
      - "8081:8081"
    depends_on:
      - postgres

  mascotas:
    build: ./mascotas
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: mascotas_db
      DB_USER: user_adm
      DB_PASSWORD: Nykolas2111
    ports:
      - "8082:8082"
    depends_on:
      - postgres

  reportes:
    build: ./reportes
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: reportes_db
      DB_USER: user_adm
      DB_PASSWORD: Nykolas2111
    ports:
      - "8083:8083"
    depends_on:
      - postgres

  apigateway:
    build: ./apigateway
    ports:
      - "8080:8080"
    depends_on:
      - usuario
      - mascotas
      - reportes

volumes:
  postgres-data:
