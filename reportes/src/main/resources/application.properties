# --- mascotasService (WebClient -> servicio de mascotas) ---
resilience4j.circuitbreaker.instances.mascotasService.sliding-window-type=count_based
resilience4j.circuitbreaker.instances.mascotasService.sliding-window-size=5
resilience4j.circuitbreaker.instances.mascotasService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.mascotasService.failure-rate-threshold=100
resilience4j.circuitbreaker.instances.mascotasService.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.mascotasService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.mascotasService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.mascotasService.register-health-indicator=true
resilience4j.circuitbreaker.instances.mascotasService.record-exceptions=\
  org.springframework.web.reactive.function.client.WebClientRequestException,\
  java.util.concurrent.TimeoutException,\
  java.net.ConnectException,\
  io.netty.channel.ConnectTimeoutException,\
  java.io.IOException
resilience4j.circuitbreaker.instances.mascotasService.ignore-exceptions=\
  org.springframework.web.reactive.function.client.WebClientResponseException,\
  com.microservice.reportes.exception.MascotaNoEncontradaException

# --- usuarioService (WebClient -> servicio de usuarios) ---
resilience4j.circuitbreaker.instances.usuarioService.sliding-window-type=count_based
resilience4j.circuitbreaker.instances.usuarioService.sliding-window-size=5
resilience4j.circuitbreaker.instances.usuarioService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.usuarioService.failure-rate-threshold=100
resilience4j.circuitbreaker.instances.usuarioService.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.usuarioService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.usuarioService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.usuarioService.register-health-indicator=true
resilience4j.circuitbreaker.instances.usuarioService.record-exceptions=\
  org.springframework.web.reactive.function.client.WebClientRequestException,\
  java.util.concurrent.TimeoutException,\
  java.net.ConnectException,\
  io.netty.channel.ConnectTimeoutException,\
