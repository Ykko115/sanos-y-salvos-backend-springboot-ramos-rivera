# H2 en memoria para tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Usar script SQL propio en vez de dejar que Hibernate genere el DDL con constraints problemáticos
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test.sql

# Deshabilitar servicios externos
cloudflare.r2.access-key=dummy
cloudflare.r2.secret-key=dummy
cloudflare.r2.bucket=dummy
cloudflare.r2.endpoint=http://localhost
mascotas.service.url=http://localhost:8081
usuario.service.urls=http://localhost:8082