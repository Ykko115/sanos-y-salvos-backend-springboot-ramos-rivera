spring.application.name=apigateway

server.port=8080

spring.cloud.gateway.server.webmvc.routes[0].id=servicio-usuario
spring.cloud.gateway.server.webmvc.routes[0].uri=${USUARIO_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/usuario/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.id=cbUsuario
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.fallbackUri=forward:/fallback/usuario

spring.cloud.gateway.server.webmvc.routes[1].id=servicio-mascota
spring.cloud.gateway.server.webmvc.routes[1].uri=${MASCOTAS_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/mascotas/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.id=cbMascotas
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.fallbackUri=forward:/fallback/mascotas

spring.cloud.gateway.server.webmvc.routes[2].id=servicio-reportes
spring.cloud.gateway.server.webmvc.routes[2].uri=${REPORTES_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/reportes/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[2].filters[0].args.id=cbReportes
spring.cloud.gateway.server.webmvc.routes[2].filters[0].args.fallbackUri=forward:/fallback/reportes

security.jwt.secret=jwt_secret_sanos_salvos_2026_clave_muy_segura_12345>

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
# ───────────────────────── Resilience4j Circuit Breaker ─────────────────────────
# Un circuito por cada backend enrutado. Se ABRE tras 5 fallos consecutivos
# (incluye errores de conexión/timeout hacia el microservicio destino).
# Configuración por defecto aplicada a las tres instancias:
resilience4j.circuitbreaker.configs.default.sliding-window-type=count_based
resilience4j.circuitbreaker.configs.default.sliding-window-size=5
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=100
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.configs.default.register-health-indicator=true

resilience4j.circuitbreaker.instances.cbUsuario.base-config=default
resilience4j.circuitbreaker.instances.cbMascotas.base-config=default
resilience4j.circuitbreaker.instances.cbReportes.base-config=default

# TimeLimiter: un destino que no responde se considera fallo a los 5s.
resilience4j.timelimiter.configs.default.timeout-duration=5s
resilience4j.timelimiter.instances.cbUsuario.base-config=default
resilience4j.timelimiter.instances.cbMascotas.base-config=default
resilience4j.timelimiter.instances.cbReportes.base-config=default

# Exponer estado de los circuit breakers (requiere actuator)
management.endpoints.web.exposure.include=health,info,gateway,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
